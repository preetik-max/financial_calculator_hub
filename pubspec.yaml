name: financial_calculator_hub

description: "Financial Calculator Hub - SIP, EMI, FD, RD, CAGR and other financial calculators."

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^1.1.1

  # Google AdMob
  google_mobile_ads: ^9.1.0

  # Number, currency and date formatting
  intl: ^0.20.2

  # HTTP/API requests
  http: ^1.6.0

  # Open external URLs / affiliate links
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ============================================================
  # APP ASSETS
  # ============================================================
  assets:

    # ----------------------------------------------------------
    # App icon
    # ----------------------------------------------------------
    - assets/icon/app_icon.png

    # ----------------------------------------------------------
    # Credit card bank logos / card images
    # Existing general cards
    # ----------------------------------------------------------
    - assets/images/cards/

    # Axis Bank Credit Cards
    # ----------------------------------------------------------
    - assets/cards/axis/
    - assets/cards/sbi/
    - assets/cards/hdfc/

    # ----------------------------------------------------------
    # Personal loan bank logos
    # ----------------------------------------------------------
    - assets/images/loans/

    # ----------------------------------------------------------
    # Home loan bank logos
    # ----------------------------------------------------------
    - assets/images/home_loans/

    # ----------------------------------------------------------
    # Car loan bank logos
    # ----------------------------------------------------------
    - assets/images/car_loans/

    # ----------------------------------------------------------
    # Insurance provider logos
    # ----------------------------------------------------------
    - assets/images/insurance/

    # ----------------------------------------------------------
    # Fixed deposit bank logos
    # ----------------------------------------------------------
    - assets/images/fixed_deposits/


# ==============================================================
# APP LAUNCHER ICON CONFIGURATION
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.png"

  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
